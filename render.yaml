services:
  - type: web
    name: smart-cooling-twin
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    branch: codex/implement-digital-twin
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: off
    disk:
      name: twin-history
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_PATH
        value: /data/twin.sqlite
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: HARDWARE_API_TOKEN
        generateValue: true
      - key: HARDWARE_TRANSPORT
        value: REST
      - key: PUBLIC_DEMO
        value: "true"
      - key: DEVICE_ID
        value: cooling-01
