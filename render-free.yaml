# Free portfolio demo: local history is temporary and resets on restart.
services:
  - type: web
    name: smart-cooling-twin-demo
    runtime: docker
    plan: free
    region: frankfurt
    branch: codex/implement-digital-twin
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_PATH
        value: /data/twin.sqlite
      - key: DASHBOARD_PASSWORD
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: HARDWARE_API_TOKEN
        generateValue: true
      - key: HARDWARE_TRANSPORT
        value: REST
      - key: PUBLIC_DEMO
        value: "true"
      - key: DEVICE_ID
        value: cooling-01
      - key: LLM_ENABLED
        value: "false"
