[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-cooling-twin"
version = "0.1.0"
description = "Model-based cooling digital twin with a bounded autonomous supervisor"
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.1,<3", "pydantic>=2.8,<3", "numpy>=1.26,<3", "pandas>=2.2,<3", "altair>=5,<7", "streamlit>=1.40,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9", "amqtt>=0.11,<0.12"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["smart_cooling_twin*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
